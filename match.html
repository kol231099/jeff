<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>AI 酒友配對 · PourMatch</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
  <canvas id="particles"></canvas>
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none;">
      <div class="logo-mark">
        <svg viewBox="0 0 40 40" width="32" height="32">
          <defs>
            <linearGradient id="lgm" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFB547"/>
              <stop offset="50%" stop-color="#FF4D8D"/>
              <stop offset="100%" stop-color="#7B5CFF"/>
            </linearGradient>
          </defs>
          <path d="M10 6h20l-3 14a7 7 0 0 1-7 6 7 7 0 0 1-7-6L10 6z" fill="url(#lgm)" opacity="0.9"/>
          <line x1="20" y1="26" x2="20" y2="34" stroke="url(#lgm)" stroke-width="2"/>
          <line x1="14" y1="34" x2="26" y2="34" stroke="url(#lgm)" stroke-width="2"/>
        </svg>
      </div>
      <span class="logo-text">PourMatch</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home">首頁</a></li>
      <li><a href="quiz.html" data-i18n="nav.quiz">品味測驗</a></li>
      <li><a href="cocktail.html" data-i18n="nav.cocktail">調酒生成器</a></li>
      <li><a href="community.html" data-i18n="nav.community">社群</a></li>
      <li><a href="match.html" data-i18n="nav.match">AI 配對</a></li>
      <li><a href="about.html" data-i18n="nav.about">關於</a></li>
    </ul>
    <button class="btn-login">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      <span data-i18n="nav.login">使用 Google 登入</span>
    </button>
  </nav>

  <main class="social-main">
    <div class="social-header">
      <h1 class="gradient-text" data-i18n="m.title">AI 酒友配對</h1>
      <p data-i18n="m.sub">依你的品味測驗找出味覺重疊度最高的人。雙方都想認識，才會開啟聊天室。</p>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="online" data-i18n="m.tab_online">在線推薦</button>
      <button class="tab" data-tab="all" data-i18n="m.tab_all">離線推薦</button>
      <button class="tab" data-tab="group" data-i18n="m.tab_group">群組配對</button>
      <button class="tab" data-tab="rooms"><span data-i18n="m.tab_rooms">我的配對</span><span class="tab-badge" id="roomsBadge" hidden>0</span></button>
    </div>

    <div id="matchBody"></div>
  </main>

  <!-- 配對成功 -->
  <div class="mm-overlay" id="matchModal" hidden>
    <div class="mm-card">
      <div class="mm-spark"></div>
      <div class="mm-title gradient-text" data-i18n="m.matched">配對成功</div>
      <div class="mm-avatars">
        <img class="mm-avatar" id="mmMe" alt="" referrerpolicy="no-referrer" />
        <div class="mm-link">🍸</div>
        <img class="mm-avatar" id="mmThem" alt="" referrerpolicy="no-referrer" />
      </div>
      <div class="mm-name" id="mmName"></div>
      <div class="mm-sub" id="mmSub"></div>
      <div class="mm-actions">
        <button class="btn-primary" id="mmChat" data-i18n="m.start_chat">開始聊天</button>
        <button class="btn-ghost" id="mmLater" data-i18n="m.keep_looking">繼續看其他人</button>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="i18n.js?v=4"></script>
  <script src="particles.js?v=10"></script>
  <script src="auth.js?v=11"></script>
  <script src="match.js?v=13"></script>
</body>
</html>
