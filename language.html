<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>語言 · Language — PourMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=29" />
<link rel="stylesheet" href="transition.css?v=25" />
<link rel="stylesheet" href="language.css?v=10" />
<script>
/* 換頁抵達時，在第一個影格之前就蓋住畫面，避免閃爍。
   若 JS 之後出錯，3 秒後自動解除，不會把頁面永遠遮住。 */
(function(){try{if(sessionStorage.getItem('pourmatch_transition')){
document.documentElement.classList.add('pour-arriving');
setTimeout(function(){document.documentElement.classList.remove('pour-arriving');},3000);}}catch(e){}})();
</script>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <main class="lang-main">
    <a class="lang-back" href="index.html">← PourMatch</a>

    <div class="lang-head">
      <div class="lang-eyebrow"><span class="dot"></span><span>語言 · LANGUAGE</span></div>
      <h1 class="lang-title">
        <span class="gradient-text">選一種語言</span>
        <span class="lang-title-en">Choose your language</span>
      </h1>
      <p class="lang-lead">
        整個網站會換成你選的語言，連 AI 給你的酒款推薦與配方也會。<br />
        <span class="dim">The whole site switches over — including the drinks the AI writes for you.</span>
      </p>
    </div>

    <div class="lang-cards">
      <button class="lang-card" data-pick="zh" type="button">
        <div class="lc-glow"></div>
        <div class="lc-mark">中</div>
        <div class="lc-name">繁體中文</div>
        <div class="lc-native">Traditional Chinese</div>
        <div class="lc-sample">「今晚想喝點什麼？」</div>
        <div class="lc-check">✓</div>
      </button>

      <button class="lang-card" data-pick="en" type="button">
        <div class="lc-glow"></div>
        <div class="lc-mark">EN</div>
        <div class="lc-name">English</div>
        <div class="lc-native">英文</div>
        <div class="lc-sample">“What are we drinking tonight?”</div>
        <div class="lc-check">✓</div>
      </button>
    </div>

    <button class="lang-confirm" id="langConfirm" type="button" disabled>
      <span id="confirmText">選擇語言 · Select a language</span>
    </button>
  </main>

  <script src="i18n.js?v=12"></script>
  <script src="transition.js?v=17"></script>
  <script src="particles.js?v=10"></script>
  <script src="language.js?v=1"></script>
</body>
</html>
