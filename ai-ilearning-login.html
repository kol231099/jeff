<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>iLearning 登入模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ai-ilearning-login.css?v=1" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <div class="brand-row">
        <div class="brand-mark">i</div>
        <div>
          <div class="brand">i-learning 2.0</div>
          <div class="school">中原大學教學平台</div>
        </div>
      </div>

      <h1>登入</h1>
      <p class="hint">測試模式：帳號與密碼可任意輸入，送出後會進入期末考入口頁。</p>

      <form id="loginForm" class="login-form">
        <label>
          <span>帳號</span>
          <input id="accountInput" name="account" type="text" autocomplete="username" placeholder="請輸入帳號" required />
        </label>

        <label>
          <span>密碼</span>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required />
        </label>

        <button type="submit">登入</button>
      </form>
    </section>
  </main>

  <script src="ai-ilearning-login.js?v=1"></script>
</body>
</html>
