<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="i18n-title" content="title.quiz" />
<title>品味測驗 · PourMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=17" />
<link rel="stylesheet" href="transition.css?v=4" />
<link rel="stylesheet" href="quiz.css?v=14" />
<link rel="stylesheet" href="shaker.css?v=2" />
<link rel="stylesheet" href="social.css?v=11" />
<script>
/* 換頁抵達時，在第一個影格之前就蓋住畫面，避免閃爍。
   若 JS 之後出錯，3 秒後自動解除，不會把頁面永遠遮住。 */
(function(){try{if(sessionStorage.getItem('pourmatch_transition')){
document.documentElement.classList.add('pour-arriving');
setTimeout(function(){document.documentElement.classList.remove('pour-arriving');},3000);}}catch(e){}})();
</script>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none;">
      <div class="logo-mark">
        <svg viewBox="0 0 40 40" width="32" height="32">
          <defs>
            <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFB547"/>
              <stop offset="50%" stop-color="#FF4D8D"/>
              <stop offset="100%" stop-color="#7B5CFF"/>
            </linearGradient>
          </defs>
          <path d="M10 6h20l-3 14a7 7 0 0 1-7 6 7 7 0 0 1-7-6L10 6z" fill="url(#lg2)" opacity="0.9"/>
          <line x1="20" y1="26" x2="20" y2="34" stroke="url(#lg2)" stroke-width="2"/>
          <line x1="14" y1="34" x2="26" y2="34" stroke="url(#lg2)" stroke-width="2"/>
        </svg>
        <div class="shaker-beat"><i></i><i></i><i></i></div>
      </div>
      <span class="logo-text">PourMatch</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home">首頁</a></li>
      <li><a href="quiz.html" data-i18n="nav.quiz">品味測驗</a></li>
      <li><a href="cocktail.html" data-i18n="nav.cocktail">調酒生成器</a></li>
      <li><a href="community.html" data-i18n="nav.community">社群</a></li>
      <li><a href="match.html" data-i18n="nav.match">AI 配對</a></li>
      <li><a href="about.html" data-i18n="nav.about">關於</a></li>
    </ul>
    <button class="btn-login">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      <span data-i18n="nav.login">使用 Google 登入</span>
    </button>
  </nav>

  <main class="quiz-main">
    <!-- 進度條 -->
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">第 1 / 12 題</span>
        <span id="progressPct">8%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- 問卷區 -->
    <div class="quiz-container" id="quizContainer">
      <!-- 題目由 JS 動態插入 -->
    </div>

    <!-- 載入動畫 -->
    <div class="loading-screen" id="loadingScreen" style="display:none;">
      <div class="shaker-stage">
        <div class="shaker-glow"></div>
        <svg class="shaker-svg" viewBox="40 32 120 232" aria-hidden="true">
          <defs>
            <linearGradient id="shMetal" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#7C86B8"/>
              <stop offset="18%"  stop-color="#EEF2FF"/>
              <stop offset="42%"  stop-color="#AAB4E0"/>
              <stop offset="66%"  stop-color="#F3F6FF"/>
              <stop offset="100%" stop-color="#6A7299"/>
            </linearGradient>
            <linearGradient id="shDrink" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#FFC46B"/>
              <stop offset="50%"  stop-color="#FF4D8D"/>
              <stop offset="100%" stop-color="#7B5CFF"/>
            </linearGradient>
            <clipPath id="shInner">
              <path d="M66,150 L134,150 L128,232 Q100,244 72,232 Z"/>
            </clipPath>
            <!-- 搖酒器外形，主體與殘影共用 -->
            <g id="shShape">
              <rect x="82" y="44" width="36" height="20" rx="6" fill="url(#shMetal)"/>
              <path d="M72,64 L128,64 L134,96 L66,96 Z" fill="url(#shMetal)"/>
              <path d="M66,96 L134,96 L128,232 Q100,246 72,232 Z" fill="url(#shMetal)"/>
              <path d="M66,96 L134,96 L133,104 L67,104 Z" fill="rgba(255,255,255,.55)"/>
            </g>
          </defs>

          <use href="#shShape" class="sh-ghost g2"/>
          <use href="#shShape" class="sh-ghost g1"/>

          <g class="sh-body">
            <use href="#shShape"/>
            <g clip-path="url(#shInner)">
              <g class="sh-content">
                <rect x="40" y="168" width="130" height="110" fill="url(#shDrink)" opacity="0.92"/>
                <rect class="sh-ice i1" x="80"  y="176" width="20" height="20" rx="5" fill="rgba(255,255,255,.72)"/>
                <rect class="sh-ice i2" x="106" y="192" width="16" height="16" rx="4" fill="rgba(255,255,255,.6)"/>
                <rect class="sh-ice i3" x="86"  y="206" width="14" height="14" rx="4" fill="rgba(255,255,255,.5)"/>
              </g>
            </g>
            <rect class="sh-sheen" x="74" y="100" width="14" height="60" rx="7" fill="rgba(255,255,255,.5)"/>
          </g>

          <circle class="sh-drop"    cx="140" cy="120" r="4"   fill="#FFD9A0" style="--dx:34px;--dy:-26px"/>
          <circle class="sh-drop d2" cx="62"  cy="140" r="3.4" fill="#FF9AC4" style="--dx:-32px;--dy:-18px"/>
          <circle class="sh-drop d3" cx="146" cy="170" r="3"   fill="#C0A6FF" style="--dx:30px;--dy:22px"/>
          <circle class="sh-drop d4" cx="58"  cy="182" r="3.6" fill="#FFD9A0" style="--dx:-28px;--dy:26px"/>
        </svg>
        <div class="shaker-beat"><i></i><i></i><i></i></div>
      </div>
      <h2 class="loading-title gradient-text" data-i18n="quiz.loading_title">分析中</h2>
      <p class="loading-sub" id="loadingSub" data-i18n="quiz.tip1">讀取你的風味 DNA…</p>
    </div>

    <!-- 結果區 -->
    <div class="result-screen" id="resultScreen" style="display:none;">
      <div class="profile-card">
        <div class="profile-label" data-i18n="quiz.dna_label">你的風味 DNA</div>
        <div class="profile-nickname gradient-text" id="profileNickname"></div>
        <div class="profile-text" id="profileText"></div>
        <div class="profile-traits" id="profileTraits"></div>
      </div>
      <h2 class="result-title"><span data-i18n="quiz.result_prefix">為你量身打造的</span> <span class="gradient-text" id="recCount">推薦</span></h2>
      <div class="rec-grid" id="recGrid"></div>
      <!-- 測驗完的下一步：拿這份結果去配對 -->
      <a href="match.html" class="next-match">
        <div class="nm-left">
          <div class="nm-label" data-i18n="quiz.next_label">下一步</div>
          <div class="nm-title" data-i18n="quiz.next_title">找出跟你味覺重疊的人</div>
          <div class="nm-sub" data-i18n="quiz.next_sub">依這份結果比對其他酒友 · 雙方都想認識才會開啟聊天</div>
        </div>
        <div class="nm-arrow">→</div>
      </a>

      <div class="result-actions">
        <button class="btn-primary" onclick="location.reload()" data-i18n="quiz.retake">再測一次</button>
        <a href="cocktail.html" class="btn-ghost" data-i18n="quiz.try_cocktail">試試調酒生成器 →</a>
      </div>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="i18n.js?v=10"></script>
  <script src="transition.js?v=3"></script>
  <script src="particles.js?v=10"></script>
  <script src="auth.js?v=13"></script>
  <script src="quiz.js?v=12"></script>
</body>
</html>
