<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="i18n-title" content="title.quiz" />
<title>品味測驗 · PourMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=18" />
<link rel="stylesheet" href="transition.css?v=7" />
<link rel="stylesheet" href="quiz.css?v=15" />
<link rel="stylesheet" href="shaker.css?v=6" />
<link rel="stylesheet" href="flood.css?v=3" />
<link rel="stylesheet" href="social.css?v=11" />
<script>
/* 換頁抵達時，在第一個影格之前就蓋住畫面，避免閃爍。
   若 JS 之後出錯，3 秒後自動解除，不會把頁面永遠遮住。 */
(function(){try{if(sessionStorage.getItem('pourmatch_transition')){
document.documentElement.classList.add('pour-arriving');
setTimeout(function(){document.documentElement.classList.remove('pour-arriving');},3000);}}catch(e){}})();
</script>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration:none;">
      <div class="logo-mark">
        <svg viewBox="0 0 40 40" width="32" height="32">
          <defs>
            <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFB547"/>
              <stop offset="50%" stop-color="#FF4D8D"/>
              <stop offset="100%" stop-color="#7B5CFF"/>
            </linearGradient>
          </defs>
          <path d="M10 6h20l-3 14a7 7 0 0 1-7 6 7 7 0 0 1-7-6L10 6z" fill="url(#lg2)" opacity="0.9"/>
          <line x1="20" y1="26" x2="20" y2="34" stroke="url(#lg2)" stroke-width="2"/>
          <line x1="14" y1="34" x2="26" y2="34" stroke="url(#lg2)" stroke-width="2"/>
        </svg>
        <div class="shaker-beat"><i></i><i></i><i></i></div>
      </div>
      <span class="logo-text">PourMatch</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home">首頁</a></li>
      <li><a href="quiz.html" data-i18n="nav.quiz">品味測驗</a></li>
      <li><a href="cocktail.html" data-i18n="nav.cocktail">調酒生成器</a></li>
      <li><a href="community.html" data-i18n="nav.community">社群</a></li>
      <li><a href="match.html" data-i18n="nav.match">AI 配對</a></li>
      <li><a href="about.html" data-i18n="nav.about">關於</a></li>
    </ul>
    <button class="btn-login">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      <span data-i18n="nav.login">使用 Google 登入</span>
    </button>
  </nav>

  <main class="quiz-main">
    <!-- 開場：選擇題數 -->
    <div class="start-screen" id="startScreen">
      <div class="start-eyebrow" data-i18n="quiz.start_eyebrow">開始之前</div>
      <h1 class="start-title" data-i18n="quiz.start_title">你想回答幾題？</h1>
      <p class="start-lead" data-i18n="quiz.start_lead">題目越多，AI 越懂你的口味，配對也越準。隨時可以再測一次。</p>

      <div class="len-grid">
        <button class="len-card" data-len="6" type="button">
          <div class="len-num">6</div>
          <div class="len-name" data-i18n="quiz.len6_t">快速</div>
          <div class="len-desc" data-i18n="quiz.len6_d">約 1 分鐘 · 抓個大方向</div>
        </button>
        <button class="len-card selected" data-len="12" type="button">
          <div class="len-badge" data-i18n="quiz.recommended">推薦</div>
          <div class="len-num">12</div>
          <div class="len-name" data-i18n="quiz.len12_t">標準</div>
          <div class="len-desc" data-i18n="quiz.len12_d">約 2 分鐘 · 完整的風味輪廓</div>
        </button>
        <button class="len-card" data-len="18" type="button">
          <div class="len-num">18</div>
          <div class="len-name" data-i18n="quiz.len18_t">深入</div>
          <div class="len-desc" data-i18n="quiz.len18_d">約 3 分鐘 · 連情境與習慣都問</div>
        </button>
      </div>

      <button class="btn-primary start-go" id="startBtn" type="button" data-i18n="quiz.start_go">開始測驗 →</button>
      <p class="start-note" data-i18n="quiz.start_note">不同長度之間仍然可以互相配對 —— 沒作答的題目不會被當成不合。</p>
    </div>

    <!-- 進度條 -->
    <div class="progress-wrap" style="display:none;">
      <div class="progress-info">
        <span id="progressText">第 1 / 12 題</span>
        <span id="progressPct">8%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- 問卷區 -->
    <div class="quiz-container" id="quizContainer" style="display:none;">
      <!-- 題目由 JS 動態插入 -->
    </div>

    <!-- 載入動畫 -->
    <div class="loading-screen" id="loadingScreen" style="display:none;">
      <div class="shake-flood" aria-hidden="true">
      </div>
      <div class="shaker-stage">
        <div class="shaker-glow"></div>
        <svg class="shaker-svg" viewBox="46 26 108 214" aria-hidden="true">
          <defs>
            <!-- 金屬：亮暗交錯的窄帶，圓柱才有立體感 -->
            <linearGradient id="shMetal" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"   stop-color="#5E6788"/>
              <stop offset="10%"  stop-color="#98A3C6"/>
              <stop offset="24%"  stop-color="#F2F5FF"/>
              <stop offset="38%"  stop-color="#B9C2E2"/>
              <stop offset="54%"  stop-color="#8C96BC"/>
              <stop offset="70%"  stop-color="#E6EBFB"/>
              <stop offset="86%"  stop-color="#9AA4C8"/>
              <stop offset="100%" stop-color="#5A6382"/>
            </linearGradient>
            <linearGradient id="shDrink" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stop-color="#FFD9A0"/>
              <stop offset="42%"  stop-color="#FF6E88"/>
              <stop offset="100%" stop-color="#8B5CE0"/>
            </linearGradient>
            <clipPath id="shInner">
              <path d="M74,116 L126,116 L122,206 Q100,215 78,206 Z"/>
            </clipPath>
            <g id="shShape">
              <!-- 頂蓋 -->
              <path d="M92,36 Q100,30 108,36 L109,48 L91,48 Z" fill="url(#shMetal)"/>
              <rect x="88" y="48" width="24" height="7" rx="2.5" fill="url(#shMetal)"/>
              <!-- 濾網段：兩端帶弧度，不是直線斜邊 -->
              <path d="M84,55 L116,55 Q120,58 121,66 L127,86 Q128,90 126,92 L74,92 Q72,90 73,86 L79,66 Q80,58 84,55 Z"
                    fill="url(#shMetal)"/>
              <!-- 接縫 -->
              <rect x="73" y="92" width="54" height="4.5" rx="2" fill="#7E88AC"/>
              <rect x="73" y="92" width="54" height="1.6" rx="0.8" fill="rgba(255,255,255,.6)"/>
              <!-- 杯身：微弧的側壁 -->
              <path d="M74,96.5 L126,96.5 Q128,150 122,206 Q100,216 78,206 Q72,150 74,96.5 Z"
                    fill="url(#shMetal)"/>
              <!-- 窄而亮的鏡面高光 -->
              <path d="M84,102 Q82,152 87,199" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M112,104 Q114,150 110,196" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.4" stroke-linecap="round"/>
            </g>
          </defs>

          <use href="#shShape" class="sh-ghost g2"/>
          <use href="#shShape" class="sh-ghost g1"/>

          <g class="sh-body">
            <use href="#shShape"/>
            <g clip-path="url(#shInner)">
              <g class="sh-content">
                <rect x="52" y="140" width="120" height="90" fill="url(#shDrink)" opacity="0.9"/>
                <rect class="sh-ice i1" x="88"  y="146" width="17" height="17" rx="4.5" fill="rgba(255,255,255,.66)"/>
                <rect class="sh-ice i2" x="107" y="160" width="13" height="13" rx="3.5" fill="rgba(255,255,255,.52)"/>
                <rect class="sh-ice i3" x="90"  y="172" width="11" height="11" rx="3" fill="rgba(255,255,255,.42)"/>
              </g>
            </g>
          </g>

          <circle class="sh-drop"    cx="132" cy="96"  r="2.6" fill="#FFD9A0" style="--dx:26px;--dy:-20px"/>
          <circle class="sh-drop d2" cx="70"  cy="112" r="2.2" fill="#FF9AC4" style="--dx:-24px;--dy:-14px"/>
          <circle class="sh-drop d3" cx="134" cy="140" r="2"   fill="#C0A6FF" style="--dx:22px;--dy:18px"/>
          <circle class="sh-drop d4" cx="68"  cy="152" r="2.4" fill="#FFD9A0" style="--dx:-20px;--dy:20px"/>
        </svg>
        <div class="shaker-beat"><i></i><i></i><i></i></div>
      </div>
      <h2 class="loading-title gradient-text" data-i18n="quiz.loading_title">分析中</h2>
      <p class="loading-sub" id="loadingSub" data-i18n="quiz.tip1">讀取你的風味 DNA…</p>
    </div>

    <!-- 結果區 -->
    <div class="result-screen" id="resultScreen" style="display:none;">
      <div class="profile-card">
        <div class="profile-label" data-i18n="quiz.dna_label">你的風味 DNA</div>
        <div class="profile-nickname gradient-text" id="profileNickname"></div>
        <div class="profile-text" id="profileText"></div>
        <div class="profile-traits" id="profileTraits"></div>
      </div>
      <h2 class="result-title"><span data-i18n="quiz.result_prefix">為你量身打造的</span> <span class="gradient-text" id="recCount">推薦</span></h2>
      <div class="rec-grid" id="recGrid"></div>
      <!-- 測驗完的下一步：拿這份結果去配對 -->
      <a href="match.html" class="next-match">
        <div class="nm-left">
          <div class="nm-label" data-i18n="quiz.next_label">下一步</div>
          <div class="nm-title" data-i18n="quiz.next_title">找出跟你味覺重疊的人</div>
          <div class="nm-sub" data-i18n="quiz.next_sub">依這份結果比對其他酒友 · 雙方都想認識才會開啟聊天</div>
        </div>
        <div class="nm-arrow">→</div>
      </a>

      <div class="result-actions">
        <button class="btn-primary" onclick="location.reload()" data-i18n="quiz.retake">再測一次</button>
        <a href="cocktail.html" class="btn-ghost" data-i18n="quiz.try_cocktail">試試調酒生成器 →</a>
      </div>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="i18n.js?v=11"></script>
  <script src="transition.js?v=7"></script>
  <script src="particles.js?v=10"></script>
  <script src="auth.js?v=13"></script>
  <script src="quiz.js?v=13"></script>
</body>
</html>
