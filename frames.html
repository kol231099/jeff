<script>
/* 換頁抵達時，在第一個影格之前就蓋住畫面，避免閃爍。
   若 JS 之後出錯，3 秒後自動解除，不會把頁面永遠遮住。 */
(function(){try{if(sessionStorage.getItem('pourmatch_transition')){
document.documentElement.classList.add('pour-arriving');
setTimeout(function(){document.documentElement.classList.remove('pour-arriving');},3000);}}catch(e){}})();
</script>

<style>
  body { background:#09080D; }
  .fr-page { width: calc(100% - 96px); max-width: 1320px; margin: 0 auto; padding: 150px 0 120px; position: relative; z-index: 2; }
  .fr-page h1 { font-family:'Cormorant Garamond','Noto Serif TC',Georgia,serif; font-size:52px; font-weight:400; margin:0 0 10px; color:#F6F2E9; }
  .fr-page .lead { font-size:14px; color:#8A857A; margin:0 0 64px; line-height:1.9; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px,1fr)); gap:76px 56px; }
  .opt { margin:0; }
  .opt figcaption { margin-top:18px; }
  .opt b { display:block; font-size:12px; font-weight:500; letter-spacing:2px; color:#F0E4C4; margin-bottom:6px; }
  .opt span { display:block; font-size:12px; line-height:1.85; color:#8A857A; }
  .fr { width:330px; }
  .fr img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:inherit; }

  /* 01 無邊框 */
  .fr-none { border-radius:14px; overflow:hidden; }
  /* 02 髮絲線 */
  .fr-hair { border-radius:14px; overflow:hidden; box-shadow:0 0 0 1px rgba(233,228,218,.14); }
  /* 03 暖金線 */
  .fr-gold { border-radius:14px; overflow:hidden; box-shadow:0 0 0 1px rgba(240,228,196,.42); }
  /* 04 襯邊 */
  .fr-mat { border-radius:6px; padding:14px; background:#15121B; box-shadow:0 0 0 1px rgba(233,228,218,.1); }
  .fr-mat img { border-radius:2px; }
  /* 05 四角標記 */
  .fr-corner { position:relative; border-radius:2px; overflow:visible; }
  .fr-corner img { border-radius:2px; }
  .fr-corner::before, .fr-corner::after,
  .fr-corner > i::before, .fr-corner > i::after {
    content:''; position:absolute; width:20px; height:20px; border:1px solid rgba(240,228,196,.55);
  }
  .fr-corner::before { top:-7px; left:-7px; border-right:0; border-bottom:0; }
  .fr-corner::after { top:-7px; right:-7px; border-left:0; border-bottom:0; }
  .fr-corner > i::before { bottom:-7px; left:-7px; border-right:0; border-top:0; }
  .fr-corner > i::after { bottom:-7px; right:-7px; border-left:0; border-top:0; }
  /* 06 浮起 */
  .fr-shadow { border-radius:14px; overflow:hidden; box-shadow:0 26px 60px rgba(0,0,0,.75), 0 4px 14px rgba(0,0,0,.5); }
  /* 07 雙線 */
  .fr-double { border-radius:4px; padding:7px; box-shadow:0 0 0 1px rgba(233,228,218,.16); }
  .fr-double img { border-radius:1px; box-shadow:0 0 0 1px rgba(233,228,218,.1); }
  /* 08 底線 */
  .fr-under { border-radius:10px 10px 0 0; overflow:hidden; padding-bottom:12px;
              border-bottom:1px solid rgba(240,228,196,.4); }
  .fr-under img { border-radius:10px 10px 0 0; }
</style>

  <main class="fr-page">
    <h1>邊框比較</h1>
    <p class="lead">同一張畫面、同樣 330px 寬，套上八種邊框處理。挑好告訴我編號，我套到 FAQ 的影片上。</p>
    <div class="grid">
      <figure class="opt">
        <div class="fr fr-none"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>01 無邊框</b><span>現況。影片直接落在頁面上，只有圓角。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-hair"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>02 髮絲線</b><span>1px 極淡的線。存在感最低，只是把邊界定義出來。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-gold"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>03 暖金線</b><span>1px 香檳色。與網站的重音色一致，較有存在感。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-mat"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>04 襯邊</b><span>邊框往外留一圈底色，像裱框的卡紙。最正式。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-corner"><i></i><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>05 四角標記</b><span>只有四個角的 L 形記號。取景框的語彙，最克制也最有個性。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-shadow"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>06 浮起</b><span>不用線，用陰影把它抬離頁面。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-double"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>07 雙線</b><span>外框加內線，中間留白。編輯設計常見。</span></figcaption>
      </figure>
      <figure class="opt">
        <div class="fr fr-under"><img src="media/studio-poster.jpg?v=1" alt=""></div>
        <figcaption><b>08 底線</b><span>只在下緣一條線。最輕，像圖說的延伸。</span></figcaption>
      </figure>
    </div>
  </main>
